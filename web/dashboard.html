<!doctype html>
<html lang="es">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Emotion Lab | Entrenamiento</title>
<style>body{margin:0;background:#101820;color:#eef2f3;font:16px Georgia,serif}main{max-width:1040px;margin:auto;padding:48px 24px}h1{font-size:clamp(2.4rem,6vw,5rem);font-weight:400;margin:8px 0;color:#f3b562}p{color:#aab8bb}.nav a{color:#f3b562;margin-right:20px}.panel{margin-top:36px;border-top:1px solid #49636a;padding-top:24px}canvas{width:100%;height:360px;background:#172630;border:1px solid #49636a}</style></head>
<body><main><div class="nav"><a href="/dashboard">Entrenamiento</a><a href="/camera">Camara</a></div><h1>El pulso del modelo</h1><p>Historial de entrenamiento, validacion y mejor checkpoint.</p><section class="panel"><canvas id="chart" width="1000" height="360"></canvas><p id="status">Cargando artifacts/training_history.json...</p></section></main>
<script>const canvas=document.querySelector('#chart'),ctx=canvas.getContext('2d');fetch('/artifacts/training_history.json').then(r=>r.ok?r.json():Promise.reject()).then(data=>{const h=data.history||[],max=Math.max(...h.map(x=>x.train_accuracy),...h.map(x=>x.validation_accuracy),1);ctx.strokeStyle='#f3b562';ctx.lineWidth=3;ctx.beginPath();h.forEach((x,i)=>{const px=40+i*(920/Math.max(h.length-1,1)),py=320-x.train_accuracy/max*270;i?ctx.lineTo(px,py):ctx.moveTo(px,py)});ctx.stroke();ctx.strokeStyle='#7dc9c0';ctx.beginPath();h.forEach((x,i)=>{const px=40+i*(920/Math.max(h.length-1,1)),py=320-x.validation_accuracy/max*270;i?ctx.lineTo(px,py):ctx.moveTo(px,py)});ctx.stroke();const accuracy=((data.best_validation_accuracy||0)*100).toFixed(2);document.querySelector('#status').textContent=`${data.framework}: ${data.epochs_completed} epocas | mejor validacion: ${accuracy}%`}).catch(()=>document.querySelector('#status').textContent='Aun no hay historial. Ejecuta main.py para entrenar y generar el grafico.');</script></body></html>
