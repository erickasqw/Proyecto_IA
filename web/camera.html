<!doctype html>
<html lang="es">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Emotion Lab | Camara</title>
<style>body{margin:0;background:#f4f0e8;color:#182629;font:16px Georgia,serif}main{max-width:1040px;margin:auto;padding:40px 24px}.nav a{color:#b04a35;margin-right:20px}h1{font-size:clamp(2.4rem,6vw,5rem);font-weight:400;margin:28px 0 8px;color:#b04a35}.stage{position:relative;margin-top:30px;background:#182629;line-height:0}video{width:100%;height:auto;display:block}canvas{position:absolute;inset:0;width:100%;height:100%}button{margin-top:20px;padding:12px 18px;background:#b04a35;color:white;border:0;font:inherit;cursor:pointer}#people{color:#b04a35}</style></head>
<body><main><div class="nav"><a href="/">Entrenamiento</a><a href="/camera">Camara</a></div><h1>Rostros en vivo</h1><p>La camara analiza todas las caras visibles y muestra una emocion por persona.</p><div class="stage"><video id="video" autoplay playsinline></video><canvas id="overlay"></canvas></div><button id="start">Activar camara</button><p id="people">Sin camara activa.</p></main>
<script>const video=document.querySelector('#video'),canvas=document.querySelector('#overlay'),ctx=canvas.getContext('2d');document.querySelector('#start').onclick=async()=>{video.srcObject=await navigator.mediaDevices.getUserMedia({video:true});setInterval(async()=>{if(!video.videoWidth)return;canvas.width=video.videoWidth;canvas.height=video.videoHeight;const shot=document.createElement('canvas');shot.width=video.videoWidth;shot.height=video.videoHeight;shot.getContext('2d').drawImage(video,0,0);const blob=await new Promise(r=>shot.toBlob(r,'image/jpeg'));const form=new FormData();form.append('image',blob,'frame.jpg');const data=await fetch('/api/detect',{method:'POST',body:form}).then(r=>r.json());ctx.clearRect(0,0,canvas.width,canvas.height);ctx.font='bold 18px Georgia';data.faces.forEach(face=>{ctx.strokeStyle='#f3b562';ctx.lineWidth=3;ctx.strokeRect(face.x,face.y,face.width,face.height);ctx.fillStyle='#f3b562';ctx.fillText(face.emotion,face.x,Math.max(22,face.y-8))});document.querySelector('#people').textContent=`${data.faces.length} rostro(s) detectado(s).`;},700)};</script></body></html>
